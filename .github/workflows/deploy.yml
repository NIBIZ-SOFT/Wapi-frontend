name: Deploy Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wajobab-frontend-production
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 4. Build Next.js
      # ---------------------------------------------------------
      - name: Build Next.js
        run: npm run build

      # ---------------------------------------------------------
      # 5. Prepare production artifact
      # ---------------------------------------------------------
      - name: Prepare production artifact
        run: |
          set -e

          rm -rf deploy

          mkdir -p deploy

          echo "Copying standalone build..."

          cp -r .next/standalone/. deploy/

          echo "Copying static files..."

          mkdir -p deploy/.next/static

          cp -r .next/static/. \
            deploy/.next/static/

          echo "Copying public directory..."

          if [ -d public ]; then
            cp -r public deploy/public
          fi

          echo "Production artifact contents:"

          du -sh deploy

          find deploy -maxdepth 2 -type f | head -100

      # ---------------------------------------------------------
      # 6. Create archive
      # ---------------------------------------------------------
      - name: Create deployment archive
        run: |
          set -e

          tar \
            -czf frontend.tar.gz \
            -C deploy .

          echo "Archive created:"

          ls -lh frontend.tar.gz

      # ---------------------------------------------------------
      # 7. Configure SSH
      # ---------------------------------------------------------
      - name: Configure SSH
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.ssh"

          printf '%s\n' \
            '${{ secrets.SERVER_SSH_KEY }}' \
            > "$HOME/.ssh/wajobab"

          chmod 600 "$HOME/.ssh/wajobab"

          echo "Validating SSH private key..."

          ssh-keygen \
            -y \
            -f "$HOME/.ssh/wajobab" \
            > /dev/null

          echo "Adding server to known_hosts..."

          ssh-keyscan \
            -H \
            '${{ secrets.SERVER_HOST }}' \
            >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

      # ---------------------------------------------------------
      # 8. Test SSH connection
      # ---------------------------------------------------------
      - name: Test SSH connection
        shell: bash
        run: |
          set -e

          ssh \
            -i "$HOME/.ssh/wajobab" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            "echo SSH_CONNECTION_OK && whoami"

      # ---------------------------------------------------------
      # 9. Upload production artifact
      # ---------------------------------------------------------
      - name: Upload deployment artifact
        shell: bash
        run: |
          set -e

          echo "Uploading frontend.tar.gz..."

          scp \
            -O \
            -i "$HOME/.ssh/wajobab" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            frontend.tar.gz \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/frontend.tar.gz'

          echo "Upload completed."

      # ---------------------------------------------------------
      # 10. Deploy on server
      # ---------------------------------------------------------
      - name: Deploy application
        shell: bash
        run: |
          set -e

          ssh \
            -i "$HOME/.ssh/wajobab" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            '${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}' \
            "sudo /usr/local/bin/wajobab-deploy frontend /tmp/frontend.tar.gz"

      # ---------------------------------------------------------
      # 11. Deployment finished
      # ---------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo " FRONTEND DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Domain:   wajobab.chat"
          echo "Server:   ${{ secrets.SERVER_HOST }}"
          echo "User:     ${{ secrets.SERVER_USER }}"
          echo "=========================================="