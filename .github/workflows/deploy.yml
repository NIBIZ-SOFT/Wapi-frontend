name: Deploy Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wajobab-frontend-production
  cancel-in-progress: true

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST || '147.93.31.214' }}
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || 'RsmMonaem66@@' }}

jobs:
  build:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm install --no-audit

      # ---------------------------------------------------------
      # 4. Build Next.js
      # ---------------------------------------------------------
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: https://api.wajobab.chat/api
          NEXT_PUBLIC_STORAGE_URL: https://api.wajobab.chat
          NEXT_PUBLIC_FRONT_URL: https://wajobab.chat
          NEXT_PUBLIC_SOCKET_URL: https://api.wajobab.chat
        run: npm run build

      # ---------------------------------------------------------
      # 5. Prepare production artifact
      # ---------------------------------------------------------
      - name: Prepare production artifact
        run: |
          set -e

          rm -rf deploy
          mkdir -p deploy

          echo "Copying standalone build..."
          cp -r .next/standalone/. deploy/

          echo "Copying static files..."
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          echo "Copying public directory..."
          if [ -d public ]; then
            cp -r public deploy/public
          fi

          echo "Production artifact contents:"
          du -sh deploy
          find deploy -maxdepth 2 -type f | head -100

      # ---------------------------------------------------------
      # 6. Create archive
      # ---------------------------------------------------------
      - name: Create deployment archive
        run: |
          set -e
          tar -czf frontend.tar.gz -C deploy .
          echo "Archive created:"
          ls -lh frontend.tar.gz

      # ---------------------------------------------------------
      # 7. Setup SSH (Key or Password)
      # ---------------------------------------------------------
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$SSH_KEY" ]; then
            printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "HAS_KEY=true" >> $GITHUB_ENV
          else
            echo "HAS_KEY=false" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------------
      # 8. Test SSH connection
      # ---------------------------------------------------------
      - name: Test SSH connection
        run: |
          set -e
          if [ "$HAS_KEY" = "true" ] && ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=8 "$SERVER_USER@$SERVER_HOST" "echo SSH_KEY_OK"; then
            echo "AUTH_MODE=key" >> $GITHUB_ENV
            echo "SSH authenticated successfully using SSH Key!"
          elif sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 "$SERVER_USER@$SERVER_HOST" "echo SSH_PASS_OK"; then
            echo "AUTH_MODE=password" >> $GITHUB_ENV
            echo "SSH authenticated successfully using Password!"
          else
            echo "::error::Both SSH Key and Password authentication failed!"
            exit 1
          fi

      # ---------------------------------------------------------
      # 9. Upload production artifact
      # ---------------------------------------------------------
      - name: Upload deployment artifact
        run: |
          set -e
          echo "Uploading frontend.tar.gz..."
          if [ "$AUTH_MODE" = "key" ]; then
            scp -i ~/.ssh/deploy_key -O -o StrictHostKeyChecking=no frontend.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/frontend.tar.gz"
          else
            sshpass -p "$SERVER_PASSWORD" scp -O -o StrictHostKeyChecking=no frontend.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/frontend.tar.gz"
          fi
          echo "Upload completed."

      # ---------------------------------------------------------
      # 10. Deploy on server
      # ---------------------------------------------------------
      - name: Deploy application
        run: |
          set -e
          if [ "$AUTH_MODE" = "key" ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "/usr/local/bin/wajobab-deploy frontend /tmp/frontend.tar.gz"
          else
            sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "/usr/local/bin/wajobab-deploy frontend /tmp/frontend.tar.gz"
          fi

      # ---------------------------------------------------------
      # 11. Deployment finished
      # ---------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo " FRONTEND DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Domain:   wajobab.chat"
          echo "Server:   $SERVER_HOST"
          echo "User:     $SERVER_USER"
          echo "=========================================="
