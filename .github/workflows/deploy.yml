name: Deploy Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wajobab-frontend-production
  cancel-in-progress: true

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST || '147.93.31.214' }}
  SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
  SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || 'RsmMonaem66@@' }}

jobs:
  build:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm install --no-audit

      # ---------------------------------------------------------
      # 4. Build Next.js
      # ---------------------------------------------------------
      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: https://api.wajobab.chat/api
          NEXT_PUBLIC_STORAGE_URL: https://api.wajobab.chat
          NEXT_PUBLIC_FRONT_URL: https://wajobab.chat
          NEXT_PUBLIC_SOCKET_URL: https://api.wajobab.chat
        run: npm run build

      # ---------------------------------------------------------
      # 5. Prepare production artifact
      # ---------------------------------------------------------
      - name: Prepare production artifact
        run: |
          set -e

          rm -rf deploy
          mkdir -p deploy

          echo "Copying standalone build..."
          cp -r .next/standalone/. deploy/

          echo "Copying static files..."
          mkdir -p deploy/.next/static
          cp -r .next/static/. deploy/.next/static/

          echo "Copying public directory..."
          if [ -d public ]; then
            cp -r public deploy/public
          fi

          echo "Production artifact contents:"
          du -sh deploy
          find deploy -maxdepth 2 -type f | head -100

      # ---------------------------------------------------------
      # 6. Create archive
      # ---------------------------------------------------------
      - name: Create deployment archive
        run: |
          set -e
          tar -czf frontend.tar.gz -C deploy .
          echo "Archive created:"
          ls -lh frontend.tar.gz

      # ---------------------------------------------------------
      # 7. Install sshpass
      # ---------------------------------------------------------
      - name: Install sshpass
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass

      # ---------------------------------------------------------
      # 8. Test SSH connection
      # ---------------------------------------------------------
      - name: Test SSH connection
        run: |
          sshpass -p "$SERVER_PASSWORD" \
            ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                "$SERVER_USER@$SERVER_HOST" \
                "echo SSH_CONNECTION_OK && whoami"

      # ---------------------------------------------------------
      # 9. Upload production artifact
      # ---------------------------------------------------------
      - name: Upload deployment artifact
        run: |
          set -e
          echo "Uploading frontend.tar.gz..."

          sshpass -p "$SERVER_PASSWORD" \
            scp -O \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                frontend.tar.gz \
                "$SERVER_USER@$SERVER_HOST:/tmp/frontend.tar.gz"

          echo "Upload completed."

      # ---------------------------------------------------------
      # 10. Deploy on server
      # ---------------------------------------------------------
      - name: Deploy application
        run: |
          set -e

          sshpass -p "$SERVER_PASSWORD" \
            ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                "$SERVER_USER@$SERVER_HOST" \
                "/usr/local/bin/wajobab-deploy frontend /tmp/frontend.tar.gz"

      # ---------------------------------------------------------
      # 11. Deployment finished
      # ---------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo " FRONTEND DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Domain:   wajobab.chat"
          echo "Server:   $SERVER_HOST"
          echo "User:     $SERVER_USER"
          echo "=========================================="
