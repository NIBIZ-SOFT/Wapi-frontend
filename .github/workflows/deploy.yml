name: Deploy Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wajobab-frontend
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare artifact
        run: |
          rm -rf deploy
          mkdir deploy

          cp -r .next/standalone/. deploy/

          mkdir -p deploy/.next/static

          cp -r .next/static/. \
            deploy/.next/static/

          if [ -d public ]; then
            cp -r public deploy/public
          fi

      - name: Create artifact
        run: |
          tar -czf frontend.tar.gz \
            -C deploy .

      - name: Upload artifact
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            -i <(echo "${{ secrets.SERVER_SSH_KEY }}") \
            frontend.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/frontend.tar.gz

      - name: Deploy
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -i <(echo "${{ secrets.SERVER_SSH_KEY }}") \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo /usr/local/bin/wajobab-deploy frontend /tmp/frontend.tar.gz"
