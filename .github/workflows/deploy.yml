- name: Verify SSH key
  env:
    SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  run: |
    set -e

    mkdir -p ~/.ssh
    printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/wajobab
    chmod 600 ~/.ssh/wajobab

    echo "Validating SSH private key..."
    ssh-keygen -y -f ~/.ssh/wajobab > /tmp/github-actions.pub

    echo "GitHub key fingerprint:"
    ssh-keygen -lf /tmp/github-actions.pub
